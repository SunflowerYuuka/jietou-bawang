modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "${mod_license}"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
# The Mods-list banner. NeoForge resolves this against the JAR ROOT (ModListScreen ->
# PackResources#getRootResource), not against assets/, so processResources copies
# assets/astrum/textures/logo.png to the root at build time; the committed file stays in one place.
logoFile = "logo.png"
description = '''公主连结主题的角色卡驱动战斗模组。'''

[[dependencies.${mod_id}]]
modId = "neoforge"
type = "required"
# 21.1.49 is the measured floor: this tree compiles with neo_version=21.1.49 and
# fails to compile on 21.1.48 (DeferredRegister#createDataComponents only takes
# (modId) before 21.1.49). Found by bisecting the 21.1 series, not assumed.
# Re-bisect before raising or lowering this number.
versionRange = "[21.1.49,)"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"

# GeckoLib 4.9.3, the animation library the 演出 entity code is built on (spec §5.6). Declared
# `required` and NOT embedded: the player installs GeckoLib themselves (依赖mod自行添加至游戏，声明依赖，
# 不要内嵌), and this declaration is what turns "the player forgot" into a load-time refusal with a
# legible message instead of a missing-class error later. The range starts at 4.7, the first
# 1.21.1-compatible 4.x line, and is open above it — GeckoLib 5 renamed the package root to
# `com.geckolib` and targets newer Minecraft, so a 5.x jar would fail to resolve this mod rather than
# load it wrongly, which is the failure we want.
#
# The dependency is unrelated to whether the UB spawns an entity: it does not (the cast is effects
# only), but the entity class, its renderer and its registration are retained for a later task and
# must keep compiling and loading.
[[dependencies.${mod_id}]]
modId = "geckolib"
type = "required"
versionRange = "[4.7,)"
ordering = "NONE"
side = "BOTH"

[features.${mod_id}]
javaVersion = "[21,)"
